[package]
name = "tokala"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/tokala"
homepage = "https://github.com/savageAZfck/tokala"
license = "MIT"
description = "A dissenting quorum for agent actions: deterministic seats vote on a normalized risk vector, verdicts carry every vote and rationale, and dissent is scored and journaled — named for the Kit Fox warrior society"
keywords = ["quorum", "council", "governance", "agent", "deliberation"]
categories = ["data-structures"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
